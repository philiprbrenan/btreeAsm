# Test 2025-09-28 at 22:15:03

name: Test
run-name: btreeAsm

on:
  push:
    paths:
      - '**/main.yml'

#concurrency:
#  group: ${{ github.workflow }}-${{ github.ref }}
# cancel-in-progress: true

jobs:

  test:
    permissions: write-all
    runs-on: ubuntu-latest

    strategy:
      matrix:
        task: [Btree, Children, Chip, Dt, StringToNumbers, Test, Verilog]

    steps:
    - uses: actions/checkout@v4
      with:
        ref: 'main'

    - name: 'JDK'
      uses: oracle-actions/setup-java@v1

    - name: Verilog install
      run: |
        sudo apt install iverilog yosys tree

    - name: Position files in package
      run: |
        mkdir -p com/AppaApps/Silicon
        tree
        cp Btree.java Children.java Chip.java Dt.java StringToNumbers.java Test.java Verilog.java com/AppaApps/Silicon

    - name: Java
      run: |
        javac -g -d Classes -cp Classes com/AppaApps/Silicon/*.java

    - name: Test Btree
      if: matrix.task == 'Btree'
      run: |
        java -XX:+UseZGC -cp Classes com/AppaApps/Silicon/Btree


    - name: Test Children
      if: matrix.task == 'Children'
      run: |
        java -XX:+UseZGC -cp Classes com/AppaApps/Silicon/Children


    - name: Test Chip
      if: matrix.task == 'Chip'
      run: |
        java -XX:+UseZGC -cp Classes com/AppaApps/Silicon/Chip


    - name: Test Dt
      if: matrix.task == 'Dt'
      run: |
        java -XX:+UseZGC -cp Classes com/AppaApps/Silicon/Dt


    - name: Test StringToNumbers
      if: matrix.task == 'StringToNumbers'
      run: |
        java -XX:+UseZGC -cp Classes com/AppaApps/Silicon/StringToNumbers


    - name: Test Test
      if: matrix.task == 'Test'
      run: |
        java -XX:+UseZGC -cp Classes com/AppaApps/Silicon/Test


    - name: Test Verilog
      if: matrix.task == 'Verilog'
      run: |
        java -XX:+UseZGC -cp Classes com/AppaApps/Silicon/Verilog

